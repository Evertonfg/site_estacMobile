server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # UMA PÁGINA SÓ. Qualquer caminho cai nela: link antigo, /planos digitado na
  # mão, varredura de robô — ninguém vê 404 do nginx no domínio principal.
  location / { try_files $uri $uri/ /index.html; }

  # ATENÇÃO AO `add_header` DO NGINX: ele NÃO É HERDADO. Um `add_header` dentro
  # de um `location` APAGA todos os do servidor naquele caminho — foi assim que
  # os três cabeçalhos de segurança sumiram justamente na página principal, que
  # é a única que alguém abre. Por isso eles são repetidos em cada bloco.
  #
  # O HTML muda a cada deploy; cachear por muito tempo faria o visitante ver a
  # versão velha depois de você publicar. Imagem e fonte podem durar.
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
  }
  location ~* \.(svg|png|jpg|webp|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff";
  }

  gzip on;
  gzip_types text/css text/javascript application/javascript image/svg+xml;
  gzip_min_length 1024;

  # O site não tem login nem formulário que grave nada, mas estes três cabeçalhos
  # custam zero e fecham as brechas triviais.
  add_header X-Content-Type-Options "nosniff";
  add_header X-Frame-Options "SAMEORIGIN";
  add_header Referrer-Policy "strict-origin-when-cross-origin";
}
